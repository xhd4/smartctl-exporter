name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      SMARTCTL_EXPORTER_VERSION: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Build exe
        run: |
          set -euo pipefail
          VER="${SMARTCTL_EXPORTER_VERSION}"
          case "$VER" in v*) ;; *) VER="v$VER" ;; esac
          COMMIT="$(git rev-parse --short HEAD)"
          mkdir -p dist
          docker build \
            --target artifact \
            --build-arg SMARTCTL_EXPORTER_VERSION="$VER" \
            --build-arg GIT_COMMIT="$COMMIT" \
            --build-arg GOARCH="${{ matrix.goarch }}" \
            --output type=local,dest=./dist/out-${{ matrix.goarch }} \
            .
          test -f "dist/out-${{ matrix.goarch }}/smartctl-exporter.exe"
          cp "dist/out-${{ matrix.goarch }}/smartctl-exporter.exe" \
            "dist/smartctl-exporter-${{ matrix.goarch }}.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: smartctl-exporter-${{ matrix.goarch }}
          path: dist/smartctl-exporter-${{ matrix.goarch }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          body_path: .github/release-body.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
